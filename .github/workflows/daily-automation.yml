name: Daily BRVM Automation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 17:10 heure Côte d'Ivoire (GMT/UTC+0), du lundi au vendredi
    # GitHub Actions utilise UTC pour cron; Côte d'Ivoire = UTC toute l'année.
    - cron: '10 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brvm-automation
  cancel-in-progress: false

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly automation
        id: run_automation
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python scripts/automation/run_daily_automation.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "⚠️ Le run a eu des erreurs partielles (exit code $EXIT_CODE)." >> "$GITHUB_STEP_SUMMARY"
            echo "Le workflow continue pour publier les fichiers générés." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Automation terminée sans erreur." >> "$GITHUB_STEP_SUMMARY"
          fi

          # On n'arrête pas le workflow: on publie quand même les sorties disponibles.
          exit 0

      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/automation_*.log
          if-no-files-found: ignore

      - name: Commit and push generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fichiers potentiellement mis à jour par l'automation
          git add YTD_2026.csv || true
          git add output/ || true
          git add docs/data/ || true
          git add data/runtime/ || true
          git add core_allocation.csv || true
          git add core_bonds_allocation.csv || true
          git add open_positions.csv executed_trades.csv portfolio_summary.csv || true
          git add bond_opportunities_*.csv || true

          if git diff --staged --quiet; then
            echo "Aucun changement à commit."
            exit 0
          fi

          git commit -m "chore: nightly automation update [skip ci]"
          git push
