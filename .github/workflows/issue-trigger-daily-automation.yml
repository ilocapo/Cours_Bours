name: Trigger Daily Automation From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-automation
  cancel-in-progress: false

jobs:
  trigger-from-issue:
    if: >-
      startsWith(github.event.issue.title, '[AUTOMATION]') &&
      contains(github.event.issue.body, '/run-daily-automation') &&
      github.actor == 'ilocapo'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Add acknowledgement comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Commande reçue. L\'automation démarre sur GitHub Actions.'
            });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily automation
        run: python run_daily_automation.py

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: daily automation update"
            git push
          fi

      - name: Comment success and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Automation terminée avec succès. Je ferme cette issue de commande.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment failure and keep issue open
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Automation échouée. Consulte les logs du workflow pour le détail.'
            });
